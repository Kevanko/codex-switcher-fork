name: Build & Release

# Every push and PR runs the tests. A `v*` tag additionally builds all
# platforms into a DRAFT release, verifies the updater manifest and every
# signature with the app's own pubkey, and only then publishes it — so users'
# auto-update never sees a release that is incomplete or wrongly signed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to (re)build and release, e.g. v1.0.0'
        required: true
        type: string

env:
  TAG: ${{ inputs.version || github.ref_name }}
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build frontend
        run: pnpm build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Versions agree (package.json, tauri.conf.json, Cargo.toml, tag)
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$pkg" = "$conf" ] && [ "$pkg" = "$cargo" ] || { echo "::error::versions differ"; exit 1; }
          if [ "$IS_RELEASE" = "true" ] && [ "${TAG#v}" != "$pkg" ]; then
            echo "::error::tag $TAG does not match app version $pkg"; exit 1
          fi

      - name: Updater logic tests (install-type selection, semver, pinned key/endpoint)
        run: node --test scripts/updater-lib.test.mjs

      - name: Updater config and verifier self-test
        # The live manifest of the current release must verify with the shipped pubkey.
        run: node scripts/verify-updater.mjs


  draft:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Tag must point at a commit that is on main
        # main only accepts commits whose tests passed (repository ruleset), so
        # this is what stops a tag on an untested branch from shipping.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main — merge it through main (tests must pass) before releasing"; exit 1
          fi

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A leftover draft from a failed run is replaced; a published release is never touched.
          state=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then echo "::error::$TAG is already published; bump the version"; exit 1; fi
          if [ "$state" = "true" ]; then gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes; fi
          gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" \
            -F draft=true -F generate_release_notes=true --jq '"release_id=\(.id)"' >> "$GITHUB_OUTPUT"

  publish:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build into the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          # Builds without a bundle marker read the plain "windows-x86_64" key.
          # It must be the per-user NSIS installer: an MSI there installs a second
          # copy in Program Files and the shortcut keeps launching the old one.
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify updater manifest and every signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir release
          node scripts/verify-updater.mjs release/latest.json --expect-version "$TAG" --assets-dir release

      - name: Every published version can update to this one
        # Replays each old release's own updater (its endpoint, its pubkey, its
        # installer type) against this draft. One broken path blocks the release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/test-update-paths.mjs release/latest.json --assets-dir release

      - name: Installers carry the right bundle marker
        # The marker decides which file the installed app's updater downloads.
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          check() { dir=$(mktemp -d); 7z x -y -o"$dir" "$1" >/dev/null
            grep -rlaq "__TAURI_BUNDLE_TYPE_VAR_$2" "$dir" || { echo "::error::$1 has no $2 marker"; exit 1; }; echo "ok $1 → $2"; }
          check release/*-setup.exe NSS
          check release/*.msi MSI

  e2e-windows:
    # Install old releases, run the new installer exactly as the in-app updater
    # does, and require: right version, no second copy, app starts, data kept.
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      # A draft release is only visible to a token that can write releases.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update from older releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$env:TAG" -R "$env:GITHUB_REPOSITORY" -p "*-setup.exe" -p "*.msi" -D new
          $setup = (Get-ChildItem new -Filter "*-setup.exe")[0].FullName
          $msi = (Get-ChildItem new -Filter "*.msi")[0].FullName
          ./scripts/e2e-windows-update.ps1 -NewSetup $setup -NewMsi $msi -NewVersion ($env:TAG -replace '^v','') -Repo $env:GITHUB_REPOSITORY

  release:
    needs: [verify, e2e-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (users start receiving the update now)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
